domain_rand:
  armature_scale_range:
  - 1.0
  - 1.1
  com_offset: 0.015
  enabled: true
  friction_range:
  - 0.5
  - 1.25
  kd_scale_range:
  - 0.85
  - 1.15
  kp_scale_range:
  - 0.85
  - 1.15
  mass_scale_range:
  - 0.85
  - 1.15
  model_pool_size: 64
  obs_noise_ang_vel: 0.1
  obs_noise_gravity: 0.02
  obs_noise_joint_pos: 0.01
  obs_noise_joint_vel: 0.15
  obs_noise_lin_vel: 0.05
  push_interval_s: 5.0
  push_vel_xy: 0.7
env:
  decimation: 4
  max_episode_steps: 1000
  model_path: humanoid_rl/models/humanoid_scene.xml
  num_envs: 4096
  num_workers: null
eval:
  interval_iterations: 50
  keep_last_videos: 12
  num_envs: 64
  num_episodes: 32
  video_every_n_evals: 5
  video_fps: 50
  video_height: 480
  video_on_best: true
  video_width: 640
log:
  checkpoint_interval_iterations: 100
  keep_last_checkpoints: 5
  log_interval_iterations: 1
network:
  activation: elu
  actor_hidden:
  - 512
  - 512
  critic_hidden:
  - 512
  - 512
  init_noise_std: 0.45
ppo:
  adaptive_lr: true
  bounds_loss_coef: 10.0
  clip_ratio: 0.2
  clip_value_loss: true
  desired_kl: 0.01
  entropy_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  horizon: 24
  learning_rate: 0.001
  log_std_max: -0.7
  lr_max: 0.01
  lr_min: 1.0e-05
  max_grad_norm: 1.0
  normalize_advantage: true
  num_epochs: 5
  num_minibatches: 4
  obs_clip: 10.0
  value_loss_coef: 1.0
run:
  device: auto
  name: arm-warm
  output_dir: runs
  seed: 0
  total_env_steps: 500000000
task:
  air_time_target: 0.44
  ang_vel_yaw_range:
  - -1.0
  - 1.0
  free_gait_prob: 0.0
  gait_frequency: 0.9
  joint_pos_noise: 0.02
  joint_vel_noise: 0.02
  lin_vel_x_range:
  - -0.5
  - 1.5
  lin_vel_y_range:
  - -0.4
  - 0.4
  max_tilt: 0.7
  sigma_ang_vel: 0.25
  sigma_heading: 0.15
  sigma_height: 0.02
  sigma_lateral_vel: 0.05
  sigma_lin_vel: 0.25
  stance_fraction: 0.6
  target_height: 0.877
  terminate_head_ratio: 0.65
  terminate_height: 0.55
  terminate_torso_upright: 0.5
  w_action_rate: -0.01
  w_alive: 0.5
  w_ang_vel: 0.5
  w_ang_vel_xy: -0.05
  w_ctrl: -0.005
  w_feet_air_time: 1.0
  w_feet_slip: -0.2
  w_flight: -0.3
  w_gait_phase: 1.0
  w_head_height: 0.3
  w_heading: 0.5
  w_height: 0.3
  w_lateral_vel: 0.4
  w_lin_vel: 1.0
  w_torso_upright: 0.6
  w_upright: 0.3
  w_vertical_vel: -0.8
  zero_command_prob: 0.05
